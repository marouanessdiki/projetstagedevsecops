groups:
- name: gestion-salaries-alerts
  rules:
  
  # CPU et Mémoire des Pods
  - alert: HighCPUUsage
    expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage detected"
      description: "CPU usage is above 80% for {{ $labels.instance }}"
      
  - alert: HighMemoryUsage
    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage detected"
      description: "Memory usage is above 85% for {{ $labels.instance }}"
      
  - alert: PodHighCPUUsage
    expr: (rate(container_cpu_usage_seconds_total[5m]) * 100) > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Pod high CPU usage"
      description: "Pod {{ $labels.pod }} CPU usage is above 80%"
      
  - alert: PodHighMemoryUsage
    expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Pod high memory usage"
      description: "Pod {{ $labels.pod }} memory usage is above 85%"

  # Disponibilité du Service
  - alert: ServiceDown
    expr: up{job="spring-boot-app"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Spring Boot service is down"
      description: "The Spring Boot application is not responding"
      
  - alert: DatabaseDown
    expr: up{job="mysql"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "MySQL database is down"
      description: "The MySQL database is not responding"
      
  - alert: JenkinsDown
    expr: up{job="jenkins"} == 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Jenkins is down"
      description: "Jenkins CI/CD service is not responding"

  # Temps de Réponse Moyen
  - alert: HighResponseTime
    expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High response time detected"
      description: "95th percentile response time is above 2 seconds"
      
  - alert: VeryHighResponseTime
    expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 5
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Very high response time detected"
      description: "95th percentile response time is above 5 seconds"
      
  - alert: HighErrorRate
    expr: (rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m])) * 100 > 5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High error rate detected"
      description: "Error rate is above 5% for {{ $labels.uri }}"
