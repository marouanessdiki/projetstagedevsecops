apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-salaries-frontend
  labels:
    app: gestion-salaries-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestion-salaries-frontend
  template:
    metadata:
      labels:
        app: gestion-salaries-frontend
    spec:
      containers:
      - name: frontend
        image: your-dockerhub-username/gestion-salaries-web:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10