# SonarQube Configuration for Gestion Salaries Backend
sonar.projectKey=gestion-salaries
sonar.projectName=Gestion Salaries Backend
sonar.projectVersion=1.0.0

# Source code
sonar.sources=src/main/java
sonar.tests=src/test/java

# Language
sonar.java.source=17
sonar.java.target=17

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/target/**,**/generated/**,**/mvnw**,**/mvnw.cmd**

# Test exclusions
sonar.test.exclusions=**/target/**

# Coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Duplications
sonar.cpd.exclusions=**/dto/**,**/entity/**,**/records/**

# Quality Gate
sonar.qualitygate.wait=true
