spring.datasource.url=jdbc:mysql://localhost:3306/gestion_salaries?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
server.port=8080
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Don't initialize data since tables already exist
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.web.resources.static-locations=classpath:/static/,file:./pdfs/
# Ensure forward headers handled if behind proxy (optional)
server.forward-headers-strategy=framework
spring.cache.type=simple

